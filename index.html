<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUVAT Solver</title>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #38bdf8;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --error: #f87171;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  background: var(--card);
  padding: 30px;
  border-radius: 8px;
  width: 420px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

h1 {
  margin-top: 0;
  text-align: center;
  font-weight: 600;
  letter-spacing: 1px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
}

.field {
  margin-bottom: 14px;
}

label {
  font-size: 13px;
  display: block;
  margin-bottom: 4px;
}

.input-row {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  padding: 8px;
  background: #0f172a;
  border: 1px solid #334155;
  color: var(--text);
  border-radius: 4px;
}

input:focus {
  outline: none;
  border-color: var(--accent);
}

select {
  padding: 8px;
  background: #0f172a;
  border: 1px solid #334155;
  color: var(--text);
  border-radius: 4px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 12px;
  background: var(--accent);
  border: none;
  border-radius: 4px;
  color: black;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.reset-btn {
  background: #334155;
  color: var(--text);
}

.message {
  margin-top: 10px;
  font-size: 13px;
  color: var(--error);
  text-align: center;
}

.footer {
  margin-top: 18px;
  font-size: 11px;
  text-align: center;
  color: var(--muted);
}
</style>
</head>
<body>

<div class="container">
  <h1>SUVAT Solver</h1>
  <div class="subtitle">Enter any 3 values. The other 2 are computed automatically.</div>

  <div class="field">
    <label>Distance (S)</label>
    <div class="input-row">
      <input type="number" id="s">
      <select id="sUnit">
        <option value="m">m</option>
        <option value="cm">cm</option>
        <option value="km">km</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Initial Velocity (U)</label>
    <div class="input-row">
      <input type="number" id="u">
      <select id="vUnit">
        <option value="mps">m/s</option>
        <option value="kmph">km/h</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Final Velocity (V)</label>
    <div class="input-row">
      <input type="number" id="v">
      <select id="vUnit2">
        <option value="mps">m/s</option>
        <option value="kmph">km/h</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Acceleration (A)</label>
    <div class="input-row">
      <input type="number" id="a">
      <select id="aUnit">
        <option value="mps2">m/s²</option>
        <option value="cmps2">cm/s²</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Time (T)</label>
    <div class="input-row">
      <input type="number" id="t">
      <span style="padding:8px;">s</span>
    </div>
  </div>

  <button onclick="resetFields()" class="reset-btn">Reset</button>

  <div class="message" id="message"></div>

  <div class="footer">All calculations performed internally in SI units.</div>
</div>

<script>
function toSI(value, type, unit) {
  if (value === null) return null;

  if (type === 'distance') {
    if (unit === 'cm') return value / 100;
    if (unit === 'km') return value * 1000;
  }

  if (type === 'velocity') {
    if (unit === 'kmph') return value / 3.6;
  }

  if (type === 'acceleration') {
    if (unit === 'cmps2') return value / 100;
  }

  return value;
}

function fromSI(value, type, unit) {
  if (value === null) return null;

  if (type === 'distance') {
    if (unit === 'cm') return value * 100;
    if (unit === 'km') return value / 1000;
  }

  if (type === 'velocity') {
    if (unit === 'kmph') return value * 3.6;
  }

  if (type === 'acceleration') {
    if (unit === 'cmps2') return value * 100;
  }

  return value;
}

function getValue(id) {
  const val = document.getElementById(id).value;
  return val === "" ? null : parseFloat(val);
}

function calculate() {
  let s = getValue("s");
  let u = getValue("u");
  let v = getValue("v");
  let a = getValue("a");
  let t = getValue("t");

  const filled = [s,u,v,a,t].filter(x => x !== null).length;

  if (filled < 3) {
    document.getElementById("message").textContent =
      "Please enter at least 3 values.";
    return;
  }

  // Convert to SI
  s = s !== null ? toSI(s, 'distance', sUnit.value) : null;
  u = u !== null ? toSI(u, 'velocity', vUnit.value) : null;
  v = v !== null ? toSI(v, 'velocity', vUnit2.value) : null;
  a = a !== null ? toSI(a, 'acceleration', aUnit.value) : null;

  try {

    // Core combinations

    if (u !== null && a !== null && t !== null) {
      v = u + a*t;
      s = u*t + 0.5*a*t*t;
    }

    else if (u !== null && v !== null && t !== null) {
      a = (v-u)/t;
      s = ((u+v)/2)*t;
    }

    else if (u !== null && v !== null && a !== null) {
      if (a === 0) throw "Acceleration cannot be zero here.";
      t = (v-u)/a;
      s = (u+v)/2*t;
    }

    else if (s !== null && u !== null && t !== null) {
      if (t === 0) throw "Time cannot be zero.";
      a = (2*(s - u*t))/(t*t);
      v = u + a*t;
    }

    else if (s !== null && u !== null && a !== null) {
      const inside = u*u + 2*a*s;
      if (inside < 0) throw "No real solution.";
      v = Math.sqrt(inside);
      t = (v-u)/a;
    }

    else if (s !== null && v !== null && a !== null) {
      const inside = v*v - 2*a*s;
      if (inside < 0) throw "No real solution.";
      u = Math.sqrt(inside);
      t = (v-u)/a;
    }

    else {
      throw "This combination is not supported.";
    }

    // Convert back
    if (s !== null)
      document.getElementById("s").value =
        fromSI(s,'distance',sUnit.value).toFixed(4);

    if (u !== null)
      document.getElementById("u").value =
        fromSI(u,'velocity',vUnit.value).toFixed(4);

    if (v !== null)
      document.getElementById("v").value =
        fromSI(v,'velocity',vUnit2.value).toFixed(4);

    if (a !== null)
      document.getElementById("a").value =
        fromSI(a,'acceleration',aUnit.value).toFixed(4);

    if (t !== null)
      document.getElementById("t").value = t.toFixed(4);

    document.getElementById("message").textContent = "";

  } catch (err) {
    document.getElementById("message").textContent = err;
  }
}

function resetFields() {
  ["s","u","v","a","t"].forEach(id =>
    document.getElementById(id).value = ""
  );
  document.getElementById("message").textContent = "";
}
</script>

</body>
</html>
